<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle circular halo -->
  <circle cx="256" cy="256" r="180" fill="#047857" opacity="0.25" />
  
  <!-- Grape leaf artistic shape -->
  <g transform="translate(256, 260) scale(1.05)">
    <!-- Main French Grape Leaf Body -->
    <path d="M0,130 C-30,120 -80,90 -120,40 C-150,0 -160,-50 -130,-90 C-110,-120 -70,-130 -40,-100 C-30,-140 10,-160 50,-150 C80,-140 100,-110 90,-70 C130,-90 170,-70 180,-30 C190,20 160,80 110,110 C60,140 20,135 0,130 Z" 
          fill="url(#leafGrad)" />
    
    <!-- Secondary leaf lobes -->
    <path d="M-15,135 Q-85,95 -105,25 Q-65,40 -20,70 Z" fill="#166534" opacity="0.4" />
    <path d="M15,135 Q85,95 105,25 Q65,40 20,70 Z" fill="#15803d" opacity="0.3" />
    
    <!-- Main central vein -->
    <path d="M0,130 Q10,-10 30,-140" stroke="url(#veinGrad)" stroke-width="7" stroke-linecap="round" fill="none" />
    
    <!-- Lateral veins -->
    <path d="M5,65 Q-50,40 -110,10" stroke="url(#veinGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M12,45 Q70,25 140,-10" stroke="url(#veinGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M18,-15 Q-40,-50 -90,-80" stroke="url(#veinGrad)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M22,-30 Q60,-70 85,-110" stroke="url(#veinGrad)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Fresh morning dew droplets -->
    <circle cx="-45" cy="15" r="9" fill="#ffffff" opacity="0.75" />
    <circle cx="-47" cy="13" r="3" fill="#ffffff" opacity="0.95" />
    
    <circle cx="55" cy="-20" r="7" fill="#ffffff" opacity="0.7" />
    <circle cx="53" cy="-22" r="2.5" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
